<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Moongate{% endblock %}</title>
<style>
  :root { color-scheme: light dark; --bg: #f4f2fb; --card: #fff; --fg: #1d1a2b; --muted: #5f5a75; --accent: #5b3fd1; --err: #b3261e; }
  @media (prefers-color-scheme: dark) { :root { --bg: #14121d; --card: #1f1c2c; --fg: #ece9f6; --muted: #a39dbd; --accent: #9d86ff; --err: #ff8a80; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
  main { width: min(100% - 32px, 380px); background: var(--card); padding: 32px; border-radius: 12px; box-sizing: border-box; }
  h1 { margin: 0 0 4px; font-size: 1.5rem; }
  p { margin: 0 0 16px; color: var(--muted); }
  label { display: block; margin: 12px 0 4px; font-weight: 600; }
  input[type=email], input[type=password] { width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid var(--muted); border-radius: 8px; background: transparent; color: inherit; font: inherit; }
  button { margin-top: 20px; width: 100%; padding: 12px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  .error { color: var(--err); font-weight: 600; }
</style>
</head>
<body>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
