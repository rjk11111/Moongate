[package]
name = "moongate"
version = "0.1.0"
edition = "2024"

[dependencies]
askama = { version = "0.16.1", default-features = false, features = ["derive", "std"] }
aws-lc-rs = "1.18.1"
axum = "0.8.9"
base64 = "0.22.1"
jsonwebtoken = { version = "11.1.0", features = ["aws_lc_rs"] }
percent-encoding = "2.3.2"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "json"] }
serde = "1.0.229"
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate", "uuid", "json"] }
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "net", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"

[dev-dependencies]
openidconnect = "4.0.1"
pem = "3.0.6"
tower = { version = "0.5.3", features = ["util"] }
